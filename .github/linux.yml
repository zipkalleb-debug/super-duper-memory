name: Linux Cloud PC - AnyDesk Fast ID

on:
  workflow_dispatch:

jobs: 
  build:
    name: Subindo maquina Linux...
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar AnyDesk e Dependencias (Xvfb)
        run: |
          sudo apt-get update -y
          # Instala o Xvfb para simular monitor para o AnyDesk
          sudo apt-get install -y xvfb
          # Adiciona repositório e chave do AnyDesk
          wget -qO - https://keys.anydesk.com/repos/DEB-GPG-KEY | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/anydesk.gpg
          echo "deb http://deb.anydesk.com/ all main" | sudo tee /etc/apt/sources.list.d/anydesk-stable.list
          sudo apt-get update -y
          sudo apt-get install -y anydesk

      - name: Configurar e Capturar ID
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Gera senha aleatória
          RANDOM_PASSWORD=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 12)
          echo "$RANDOM_PASSWORD" | sudo anydesk --set-password
          
          # Inicia o AnyDesk em uma tela virtual
          xvfb-run --server-args="-screen 0 1024x768x24" anydesk --start-service &
          
          echo "Aguardando geração do ID (tentativa em 30 segundos)..."
          
          ANYDESK_ID=""
          # Loop de 10 tentativas a cada 3 segundos
          for i in {1..10}; do
            sleep 3
            # Tenta pegar o ID
            ANYDESK_ID=$(xvfb-run --server-args="-screen 0 1024x768x24" anydesk --get-id 2>/dev/null | tr -d '\n')
            
            if [ -n "$ANYDESK_ID" ]; then
              break
            fi
            echo "Tentativa $i: Ainda buscando..."
          done

          # Resultado
          echo "=========================================="
          if [ -n "$ANYDESK_ID" ]; then
              echo "SEU ID ANYDESK : $ANYDESK_ID"
          else
              echo "AVISO: ID não gerado. Verifique os logs."
          fi
          echo "SUA SENHA      : $RANDOM_PASSWORD"
          echo "=========================================="

          # Notificação via Telegram (Opcional)
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              MSG="🐧 *Cloud PC Pronto!*%0A%0A🔑 *ID:* \`$ANYDESK_ID\`%0A🔐 *Senha:* \`$RANDOM_PASSWORD\`"
              curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
                -d "chat_id=$TELEGRAM_CHAT_ID" \
                -d "text=$MSG" \
                -d "parse_mode=Markdown" > /dev/null
          fi

      - name: Manter Maquina Ligada
        run: |
          echo "Mantendo maquina ligada..."
          sleep 6h
          
