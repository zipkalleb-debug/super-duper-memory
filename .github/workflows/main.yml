name: Linux Cloud PC - RDP Remoto (Mais Rápido)

on:
  workflow_dispatch:

jobs:
  build:
    name: Subindo Linux com RDP...
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar Interface e RDP
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          # Configura o XFCE para rodar no RDP
          echo xfce4-session > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Instalar Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -y
          sudo apt-get install -y ngrok

      - name: Iniciar Túnel e Obter Endereço
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          ngrok authtoken $NGROK_TOKEN
          # O RDP usa a porta 3389
          ngrok tcp 3389 &
          sleep 5
          
          URL=$(curl -s http://localhost:4040/api/tunnels | grep -oP 'tcp://\K[^"]+')
          echo "=========================================="
          echo "CONEXÃO RDP PRONTA!"
          echo "ENDEREÇO : $URL"
          echo "Usuário: runner (ou root)"
          echo "Senha  : (Defina uma senha abaixo se necessário)"
          echo "=========================================="

      - name: Manter Maquina Ligada
        run: |
          # Define senha para o usuário runner
          echo "runner:123456" | sudo chpasswd
          while true; do sleep 60; done
          
