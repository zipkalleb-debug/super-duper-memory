name: Linux Cloud PC - AnyDesk Direct

on:
  workflow_dispatch:

jobs: 
  build:
    name: Subindo maquina Linux...
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar Dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb dbus-x11
          
          # Baixa e instala AnyDesk
          wget -qO - https://keys.anydesk.com/repos/DEB-GPG-KEY | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/anydesk.gpg
          echo "deb http://deb.anydesk.com/ all main" | sudo tee /etc/apt/sources.list.d/anydesk-stable.list
          sudo apt-get update -y
          sudo apt-get install -y anydesk

      - name: Rodar AnyDesk Force
        run: |
          # 1. Mata qualquer processo do AnyDesk que travou na instalacao
          sudo killall anydesk || true
          
          # 2. Inicia o D-Bus e o Xvfb (necessários para o AnyDesk funcionar em servidor)
          sudo /etc/init.d/dbus start
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          
          # 3. Tenta configurar a senha ignorando o serviço (acesso direto)
          echo "password123" | sudo anydesk --set-password
          
          # 4. Inicia em background
          sudo anydesk --start-service &
          
          # 5. Aguarda e verifica o ID
          echo "Aguardando geração do ID..."
          sleep 10
          
          # Tenta o comando direto, se falhar, tenta ler o arquivo
          ANYDESK_ID=$(anydesk --get-id 2>/dev/null || grep -oP 'ad.anydesk.id=\K\d+' /etc/anydesk/system.conf)
          
          echo "=========================================="
          echo "SEU ID ANYDESK : $ANYDESK_ID"
          echo "SENHA          : password123"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do sleep 60; done
          
