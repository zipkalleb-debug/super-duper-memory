name: Windows Cloud PC - Anydesk (Optimized)

on:
  workflow_dispatch:

jobs: 
  build:
    name: Start Building...
    runs-on: windows-2022
    timeout-minutes: 360  # Limite de 6 horas

    steps:
      - name: Installing AnyDesk via Chocolatey
        run: |
          choco install anydesk -y --no-progress --ignore-checksums
          Start-Sleep -Seconds 5

      - name: Configure and Start AnyDesk
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\anydesk.exe"
          $systemConfig = "C:\ProgramData\AnyDesk\system.conf"
          $serviceConfig = "C:\ProgramData\AnyDesk\service.conf"
          
          if (Test-Path $anydeskPath) {
              Write-Host "AnyDesk encontrado! Configurando acesso..."
              
              # Gera senha aleatória de 12 caracteres
              $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
              $randomPassword = -join ((1..12) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
              
              # Define a senha para acesso não supervisionado
              echo $randomPassword | & $anydeskPath --set-password
              
              # Inicia o serviço do AnyDesk
              Start-Process -FilePath $anydeskPath -ArgumentList "--start-service"
              
              # Aguarda a geração dos arquivos de rede do AnyDesk
              Write-Host "Aguardando obtenção do ID na rede AnyDesk..."
              Start-Sleep -Seconds 20
              
              $anydeskId = $null
              
              # 1. Tenta pegar o ID no system.conf
              if (Test-Path $systemConfig) {
                  $idMatch = Get-Content $systemConfig -ErrorAction SilentlyContinue | Select-String "ad.anydesk.id="
                  if ($idMatch) {
                      $anydeskId = $idMatch.ToString().Split("=")[1].Trim()
                  }
              }
              
              # 2. Se não achou, tenta no service.conf
              if (-not $anydeskId -and (Test-Path $serviceConfig)) {
                  $idMatch = Get-Content $serviceConfig -ErrorAction SilentlyContinue | Select-String "ad.anydesk.id="
                  if ($idMatch) {
                      $anydeskId = $idMatch.ToString().Split("=")[1].Trim()
                  }
              }
              
              # 3. Tenta via comando, tratando o valor nulo para evitar exceções
              if (-not $anydeskId) {
                  $cmdOutput = & $anydeskPath --get-id 2>$null
                  if ($cmdOutput) {
                      $anydeskId = $cmdOutput.ToString().Trim()
                  }
              }
              
              # Exibe o resultado final
              Write-Host "=========================================="
              if ($anydeskId) {
                  Write-Host "SEU ID ANYDESK : $anydeskId"
              } else {
                  Write-Host "AVISO: Não foi possível obter o ID diretamente no log."
                  Write-Host "Verifique os arquivos de configuração na pasta C:\ProgramData\AnyDesk\"
              }
              Write-Host "SUA SENHA      : $randomPassword"
              Write-Host "=========================================="
              
          } else {
              Write-Error "AnyDesk não foi encontrado no caminho padrão."
              exit 1
          }

      - name: Keep Alive and Monitor
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\anydesk.exe"
          
          # Mantém a VM viva até atingir o tempo limite do Job
          while ($true) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $process) {
                  Write-Host "Reiniciando serviço AnyDesk..."
                  Start-Process -FilePath $anydeskPath -ArgumentList "--start-service"
              }
              Start-Sleep -Seconds 60
          }
          
