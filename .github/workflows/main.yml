name: Linux Cloud PC - RDP Ngrok

on:
  workflow_dispatch:

jobs:
  build:
    name: Subindo Linux com RDP...
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar Interface e RDP
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          echo xfce4-session > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          echo "runner:123456" | sudo chpasswd

      - name: Instalar e Iniciar Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -y
          sudo apt-get install -y ngrok
          
          # Cole o seu Authtoken do Ngrok entre as aspas abaixo:
          ngrok authtoken "SEU_TOKEN_DO_NGROK_AQUI"
          
          # Inicia o túnel RDP
          ngrok tcp 3389 &
          sleep 5
          
          # Exibe o endereço final para o Windows App
          URL=$(curl -s http://localhost:4040/api/tunnels | grep -oP 'tcp://\K[^"]+')
          echo "=========================================="
          echo "ENDEREÇO PARA O WINDOWS APP: $URL"
          echo "USUÁRIO: runner"
          echo "SENHA  : 123456"
          echo "=========================================="

      - name: Manter Maquina Ligada
        run: |
          while true; do sleep 60; done
          
