name: Windows Cloud PC - Anydesk (Optimized)

on:
  workflow_dispatch:

jobs: 
  build:
    name: Start Building...
    runs-on: windows-2022
    timeout-minutes: 360  # Limite de 6 horas

    steps:
      - name: Installing AnyDesk via Chocolatey
        run: |
          choco install anydesk -y --no-progress --ignore-checksums
          Start-Sleep -Seconds 5

      - name: Configure and Start AnyDesk
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\anydesk.exe"
          $configPath = "C:\ProgramData\AnyDesk\system.conf"
          
          if (Test-Path $anydeskPath) {
              Write-Host "AnyDesk encontrado! Configurando acesso..."
              
              # Gera senha aleatória de 12 caracteres
              $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
              $randomPassword = -join ((1..12) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
              
              # Define a senha para acesso não supervisionado
              echo $randomPassword | & $anydeskPath --set-password
              
              # Inicia o serviço do AnyDesk
              Start-Process -FilePath $anydeskPath -ArgumentList "--start-service"
              
              # Aguarda a geração do ID e do arquivo de configuração
              Write-Host "Aguardando obtenção do ID na rede AnyDesk..."
              $timeout = 30
              while (-not (Test-Path $configPath) -and $timeout -gt 0) {
                  Start-Sleep -Seconds 2
                  $timeout -= 2
              }
              
              Start-Sleep -Seconds 10
              
              # Extrai o ID diretamente da chave do arquivo de configuração
              $anydeskId = ""
              if (Test-Path $configPath) {
                  $idLine = Get-Content $configPath | Select-String "ad.anydesk.id="
                  if ($idLine) {
                      $anydeskId = $idLine.ToString().Split("=")[1].Trim()
                  }
              }
              
              # Se não encontrar no arquivo, tenta o comando secundário
              if (-not $anydeskId) {
                  $anydeskId = (& $anydeskPath --get-id).Trim()
              }
              
              Write-Host "=========================================="
              Write-Host "SEU ID ANYDESK : $anydeskId"
              Write-Host "SUA SENHA      : $randomPassword"
              Write-Host "=========================================="
              
          } else {
              Write-Error "AnyDesk não foi encontrado no caminho padrão."
              exit 1
          }

      - name: Keep Alive and Monitor
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\anydesk.exe"
          
          # Mantém a VM viva até atingir o tempo limite do Job
          while ($true) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $process) {
                  Write-Host "Reiniciando serviço AnyDesk..."
                  Start-Process -FilePath $anydeskPath -ArgumentList "--start-service"
              }
              Start-Sleep -Seconds 60
          }
          
